[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yechao"
version = "0.1.0"
description = "夜抄 —— 把散在多个群里的通知、报名、活动、失物招领整理成按天可读的日报"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# ※ 云上的两个驱动**刻意不进默认依赖**。
#
# 理由是本项目的一条红线：「评委 clone 下来直接跑」不能要求先配环境。
# `python -m yechao demo` 走的是 SQLite + 空缓存，那两样都是标准库/内置的
# —— 所以默认装的那一份必须能跑通三步复现。
#
# ※ 而这两个驱动都是**延迟导入**的（`connect_mysql` / `RedisCache.from_url`
# 里才 import）：没装它们时，程序**报错并说清怎么装**，而不是悄悄退回本地
# —— 退回去的症状是「用户以为连上了云库，其实写在本地文件里」，而它
# **看起来是成功的**。
mysql = ["pymysql>=1.1"]
redis = ["redis>=5"]

# ※ 读 Chromium 系浏览器（Edge / Chrome）的登录态要它（AES-256-GCM）。
# 同一条判据：默认那一份必须能跑通三步复现，而「读浏览器登录态」是可选功能
# —— `browser_cookies` 里**延迟导入**它，没装时报错并说清怎么装，不回落成
# 「读不到」（那会让你以为浏览器里根本没登录）。Firefox 的库不加密，用不上它。
browser = ["cryptography>=42"]
# ※ 读 QQ 的加密消息库也要它（SQLCipher 的逐页 AES）。与 `browser` 是同一个
# 包、同一个理由：**它不在默认依赖里**，因为三步复现不能要求装它。
qq = ["cryptography>=42"]

dev = [
    "pytest>=8",
    "httpx>=0.27",
    # ※ 测试要**真的**跑一遍解密链路（用已知密钥造一份最小 cookie 库），
    # 所以开发环境要有它。它仍然**不在** `dependencies` 里 —— 红线没动。
    "cryptography>=42",
]

[project.scripts]
# ※ 指到 `__main__`，**不是** `interfaces.cli`。
# 写者锁接在 `__main__` 上（`cli.main` 会被测试在同一进程里反复调用，
# 锁放进去它们会互相抢锁）。指错的话，装包之后的 `yechao refine`
# **不拿锁**，而 `python -m yechao refine` 拿 —— 两条入口行为不一致，
# 且从命令上看不出来。
yechao = "yechao.__main__:main"

[tool.setuptools.packages.find]
include = ["yechao*"]

[tool.setuptools.package-data]
yechao = ["web/dist/**/*", "web/dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ※ 不设 `addopts = -q`：默认输出里那句 "N passed" 是空转自检要读的东西，
# 而 `-q` 会把每层跑了几个用例压掉。护栏的报告必须看得见。
filterwarnings = ["error::DeprecationWarning:yechao.*"]
