# 夜抄 · 单机部署
#
# ⚠️ 这份 compose 是**部署链路的声明侧**。`tests/contracts/test_deploy_contract.py`
# 从它这里读「需要哪些必填变量」，再从 `.env.example` 与 `deploy/entrypoint.sh`
# 读「脚本实际给了什么」—— **两边各自读，不手写一张期望表**。
# 手写的期望表会漂移，而漂移是静默的（`docs/补遗` §三）。
#
# 为什么是 compose 而不是只写 ECS 步骤：
# 评委复现时最需要的是「一条命令起得来」。K8s / CCE 是另一个量级的东西，
# 而这个产品的规模用不上 —— 用它反而会让复现门槛变高。
services:
  yechao:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: yechao:latest
    ports:
      - "${YECHAO_PORT:?必须指定宿主端口}:8000"
    environment:
      # ⚠️ 下面每一项都是**必填**（`${VAR:?msg}` 的写法）。
      # 缺任何一项，compose 会在**创建任何资源之前**中止并指出缺的是哪个。
      #
      # 这个写法的价值：`docs/补遗` §三 第一种失败是「参数契约对不上 ——
      # 基础设施声明了一堆必填参数，而部署脚本只传了其中两个。
      # 结果：第一次执行就报『缺少必填值』，在创建任何资源之前中止」。
      # 用 `:?` 让它**在本地就能报**，而不是等到云上。
      YECHAO_DATA_DIR: "${YECHAO_DATA_DIR:?必须指定数据目录（容器内挂载点）}"
      YECHAO_CONFIG_DIR: "${YECHAO_CONFIG_DIR:?必须指定配置目录（容器内挂载点）}"
      YECHAO_LLM_BASE_URL: "${YECHAO_LLM_BASE_URL:?必须指定模型端点}"
      YECHAO_LLM_MODEL: "${YECHAO_LLM_MODEL:?必须指定模型名}"
      # 密钥**可以**为空（本地 Ollama 不需要），所以用 `${VAR:-}` 而不是 `:?`。
      # ⚠️ 这个区别是刻意的：「必填」与「可空」不能都写成同一种形状，
      # 否则一个「忘了配密钥」会被当成「配了一个空密钥」。
      YECHAO_API_KEY: "${YECHAO_API_KEY:-}"
    volumes:
      - "${YECHAO_DATA_DIR:?}:${YECHAO_DATA_DIR:?}"
      - "${YECHAO_CONFIG_DIR:?}:${YECHAO_CONFIG_DIR:?}"
    # ⚠️ 健康检查指向一个**真的会读库**的端点，不是 `/`。
    # 首页是静态文件 —— 它 200 不代表数据库通、配置读得到。
    # 一个只探静态页的健康检查会让「服务起了但库是坏的」看起来像健康。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/items?limit=1',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
