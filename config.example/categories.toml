# 夜抄 · 类目模板
#
# ## 判据是「这条消息**要读者做什么**」，不是「它属于哪个话题」
#
# 这个产品把群聊里的消息整理成一份「今天要办什么」的日报，所以类目回答的是
# 「我要做什么」，而不是「这条属于哪个话题」。推导见
# `yechao/domain/categories.py` 的模块 docstring。
#
# ## `desc` 是**判据**，会逐字进提示词
#
# 它的读者是模型：要写成能照着判的规则，不要写成给人看的简介。
# 改这里等于改模型的行为。
#
# ## 没有 `icon` 字段
#
# 图标由**前端**按 slug 映射（`web/src/lib/theme.ts`）—— 把前端库的命名
# 写进用户数据，会在换图标库那天让用户数据报废。
# ※ 旧文件里可能还留着 `icon = "..."`：读的时候会**忽略**它，不会报错。

[[category]]
slug = "todo"
label = "要办的事"
desc = "要读者**在某个时间之前办完一件手续**。例如报名、提交材料、缴费、选课、申请缓考、领取物品。判据是「有一件必须由读者动手办的事」，通常带一个截止时间；而不是消息里出现了「通知」「选课」这些词。※ 只要读者需要动手办，哪怕没写截止时间也归这里；只要不用动手，就归「只要知道」。"

[[category]]
slug = "attend"
label = "要到场的事"
desc = "要读者**在某个时刻出现在某个地点**。例如讲座、比赛、晚会、招新摆摊、集合、展览。判据是「有一个开始时刻 + 一个地点 + 要人去」，而不是消息里出现了「活动」这个词。※ 与「要办的事」的分界：**到场**归这里，**办手续**归那里。同一句话里既有「报名截止到 X」又有「X 点在某地举行」时，归「要办的事」—— 名没报上，到场就无从谈起。"

[[category]]
slug = "know"
label = "只要知道"
desc = "要读者**知道一个安排**，但不用动手做任何事。例如放假安排、校历变更、系统维护、停水停电、班车时刻、食堂菜谱。判据是「读者读完只需要记住，不需要办、不需要到场」。※ 与「要办的事」的分界就是**要不要动手**：消息里出现「充值」「报名」「提交」这类要读者做的事，就不归这里。"

[[category]]
slug = "claim"
label = "失物招领"
desc = "要读者**去核对、归还或认领一件物品**。例如捡到校园卡、丢失雨伞、寻找失主。判据是「有一件东西丢了或捡到了 + 要找它的主人或失主」。※ 与「转让求购」的分界：无偿找回原主归这里，有对价的买卖归那里。"

[[category]]
slug = "trade"
label = "转让求购"
desc = "要读者**去联系卖方或买方**，就一件物品谈转让或求购。例如出闲置、求购、拼单、代购，通常带有价格。判据是「有对价 + 要读者去联系对方」。"

[[category]]
slug = "recruit"
label = "招人"
desc = "要读者**去投递、应聘或申请一个岗位 / 名额**。例如勤工助学、实习招聘、兼职、志愿服务招募。判据是「有一个招募方在等人来」，而不是消息里出现了「招聘」这个词。※ 与「要办的事」的分界：**投递 / 应聘**（有个招募方在等你）归这里，**办手续**（报名一场活动、提交一份材料）归那里。"
