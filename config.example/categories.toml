[[category]]
slug = "notice"
label = "通知公告"
icon = "📋"
desc = "要读者知道某个安排，通常没有要求读者立刻动手。例如校历变更、放假安排、系统维护、政策说明。"

[[category]]
slug = "academic"
label = "学业"
icon = "📚"
desc = "要读者**去办一件有截止时间的手续**。例如选课、报名考试、提交作业或材料、申请缓考、缴费注册。判据是「有一件必须办的事 + 一个截止时间」，而不是消息里出现了「课」「考试」这些词。"

[[category]]
slug = "activity"
label = "活动"
icon = "🎤"
desc = "要读者**去参加一个在特定时间地点发生的活动**。例如讲座、比赛、晚会、招新、展览、运动会。判据是「有一个开始时刻 + 一个地点 + 去参加」，而不是消息里出现了「活动」这个词。"

[[category]]
slug = "life"
label = "生活"
icon = "🏠"
desc = "与校园日常生活有关的信息，既不是要办的手续也不是要参加的活动。例如食堂开饭时间、宿舍水电、班车时刻、周边店铺、天气提醒。"

[[category]]
slug = "secondhand"
label = "二手"
icon = "🛒"
desc = "要读者**买卖或转让物品**。例如出闲置、求购、拼单、代购。通常带有价格。"

[[category]]
slug = "lostfound"
label = "失物招领"
icon = "🔍"
desc = "要读者**认领或归还失物**。例如捡到校园卡、丢失雨伞、寻找失主。判据是「有一件东西丢了或捡到了 + 要找它的主人或失主」。"

[[category]]
slug = "job"
label = "兼职招聘"
icon = "💼"
desc = "要读者**去应聘或参与一个有报酬/有岗位性质的工作**。例如勤工助学、实习招聘、兼职、志愿服务招募。"
