# 夜抄 · 模型设置模板
#
# ※ 复制成 `config/settings.toml` 再改（或者让程序首启时自动复制）。
#
# ## 两段配置，看的东西不同
#
# [llm]    —— 本地模型，看的是**原文**（只在本机内存里）
# [cloud]  —— 云端模型，只看**脱敏后的结构化条目**
#
# 两段都可以不配：
#   · 不配 [llm]   ⇒ refine 会拒绝跑并告诉你缺什么（网页仍可用）
#   · 不配 [cloud] ⇒ 云端二次处理这一步跳过，其余照常
#
# ## 密钥不进这里
#
# 密钥走环境变量：YECHAO_API_KEY（本地）/ YECHAO_CLOUD_API_KEY（云端）。
# 配置文件会被导出、会被提交，所以它不该有密钥。

# [llm]
# base_url = "http://127.0.0.1:11434/v1/chat/completions"
# model = "qwen3:8b"
#
# ※ enable_thinking 是**三态**：
#   · 不写这个键  = **不发这个字段**（通用 OpenAI 端点最安全的形状）
#   · = false     = 显式发 false（硅基流动 / Qwen 一类端点用这个）
#   · = true      = 显式发 true
# 配置页上这两种写法看着一样，发出去的请求体却不同：一个是根本没有
# enable_thinking 这个键，一个是这个键的值为 false。
# enable_thinking = false

# [cloud]
# base_url = "https://你的端点/v1/chat/completions"
# model = "你的模型名"

# ## 缓存：TTL 在这里，**连接串不在这里**
#
# [cache] 段只管**策略**，不管**凭据**：
#   · 连接串（含密码）走环境变量 `YECHAO_REDIS_URL` —— 与 `YECHAO_API_KEY`
#     同一个理由：配置文件会被导出、会被提交。
#   · TTL 不是机密，而且它是**产品策略**（多旧的数据还能接受），
#     所以要能被看见、能被改、能跟着配置包走。
#
# ※ 不配 `YECHAO_REDIS_URL` 时这一段的 TTL 用不上 —— 缓存后端是空实现，
# 它不存任何东西。而「用的是空实现」这件事在 `GET /api/health` 里
# 写得清清楚楚（`cache.backend = "none"`、`enabled = false`），
# 不会让你以为缓存在工作。
#
# [cache]
# ※ 单位是秒。判据是「**小于**消费方的轮询间隔」：
# `/api/urgent` 每 30 秒被前端取一次，所以 10 秒的 TTL 意味着用户下一次
# 来取的时候缓存已经过期了 —— 他看到的新鲜度与不缓存时**完全一样**，
# 而服务器少算了很多次。把它调到 30 以上就会开始「看得见地旧」。
# 0 = **不过期**（显式选择，不是「没配」）。
# ttl_seconds = 10

# ## 「每天几点跑日报」**不在这里**
#
# 那份日报由 `deploy/scheduler.sh` 那个容器定时跑（`docker compose` 里的
# `scheduler` 服务），而它是个 **shell 循环**，不是这个 Python 应用 ——
# 把时刻放在这里，等于让一段 shell 去解析一份 TOML（或者去问 python），
# 也就是给同一个问题开第二个读法。
#
# 所以它在环境变量里：`YECHAO_DAILY_AT`（24 小时制 `HH:MM`，默认 `07:30`）。
# 见 `.env.example` 的「定时」那一节。
#
# ※ 这里**不写**这个键、也不写一个同名的占位 —— 两处都写就会出现
# 「我在配置文件里改了但它没生效」，而两边看起来都配好了。
