# 夜抄 · 追踪规则模板
#
# ※ 复制成 `config/tracks.toml` 再改（或者让程序首启时自动复制）。
#
# ## 追踪是什么，不是什么
#
# 它是**流水线上的一层标记** —— 不产出任何一条消息，只回答两个问题：
#
#   · 这个账号说的话，值不值得**越过预筛**（`kind = "person"`）
#   · 这条条目的标题 / 详情里，有没有那个名词（`kind = "term"`）
#
# ※ 它**不是**数据源。把它做成源会造出「同一件事被两条路各读一遍」——
# 两条路产出的消息没有共同主键（`msg_id` 对不上），于是「重跑不会重复」
# 这条保证失效，而它**不报错**。
#
# ## 两类规则的差别不只是「两个例子」
#
#   person —— 判据是**结构化**的（消息的账号），所以它**在预筛之前**就能判。
#             这正是「这个账号说的话不被预筛丢掉」能成立的原因。
#   term   —— 判据是**文本**的（条目的标题 / 详情），只能在**条目成型之后**判。
#
# ## 两条硬丢弃**不受追踪影响**
#
# 纯应答（「收到」「好的」）与纯符号（「+++」「哈哈哈哈」）仍然会被丢掉。
# 它们判的是「这条消息**没有信息量**」，与「谁发的」无关 —— 把一条「收到」
# 抽成条目只会让日报多一行噪声，而模型对它也只能回空。
# 追踪要防的是「这个人的话**因为没命中锚、或者太短**而被默认丢掉」。
#
# ## 写法
#
# 每一条是一个 `[[track]]`，两个键都要写：
#
#   kind  = "person" | "term"
#   value = 账号（整数）或名词（字符串）
#
# 改完**下一轮就生效**（每轮重读一次配置）—— 不需要重启。

# 追踪某个账号说的话。
# ※ 账号是这个人**在源系统里的标识**（群里的号码、工号、学号）。
#    匿名消息没有账号，**永远不会**被人物规则命中 —— 这是刻意的：
#    「匿名」与「账号是 0」在本项目里是两件事，不允许用 0 冒充。
#
# [[track]]
# kind = "person"
# value = 17700001001

# 追踪某个名词。
# ※ 子串匹配：`value = "奖学金"` 会命中「关于奖学金评定的通知」。
#    不做分词 —— 分词需要词典与切分器，而它们会把「为什么命中」
#    变成一句要再解释一次的话。
#
# [[track]]
# kind = "term"
# value = "奖学金"
