<!doctype html>
<html lang="zh-CN" data-theme="yoi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta id="theme-color" name="theme-color" content="#0a0c12" />
    <!--
      PWA：manifest + 192/512 位图图标 + service worker（T5 起）。
      ※ 标签页仍用 SVG 图标；安装器与 iOS 要 PNG，见 public/icons/。
      manifest 与图标都由 Vite 从 public/ 拷进 dist/。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="夜抄" />
    <title>夜抄</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
