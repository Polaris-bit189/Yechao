<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="夜抄">
  <!--
    maskable 版：底色铺满画布，图形缩到中央 80% 安全区。
    安全区是圆的（直径 80%），所以图形只放中央，四角留给安装器的裁切。
  -->
  <rect width="512" height="512" fill="#0a0c12" />
  <g transform="translate(51.2 51.2) scale(6.4)">
    <defs>
      <mask id="crescent-maskable">
        <rect width="64" height="64" fill="#000" />
        <circle cx="26" cy="26" r="16" fill="#fff" />
        <circle cx="33" cy="22" r="14" fill="#000" />
      </mask>
    </defs>
    <circle cx="26" cy="26" r="16" fill="#79a6cf" mask="url(#crescent-maskable)" />
    <g fill="#e7ecf6">
      <rect x="14" y="46" width="26" height="3" rx="1.5" opacity="0.92" />
      <rect x="14" y="52" width="17" height="3" rx="1.5" opacity="0.55" />
    </g>
  </g>
</svg>
